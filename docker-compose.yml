services:
  postgres:
    image: postgres:16.4-alpine
    container_name: next_saas_starter_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: node:20-alpine
    container_name: whatsaas-app
    working_dir: /app
    env_file:
      - .env
      # Claves de las terminales del admin, aparte del .env general: el gateway
      # del host las lee del mismo archivo (un solo secreto, dos lectores).
      - .env.terminal
    # ffmpeg se instala al arrancar, pero el arranque NO depende de él: el
    # 2026-09-07 el mirror de Alpine se colgó y la app estuvo 10 minutos sin
    # levantar (502) por un `&&`. Con tope de 90 s y sin cortar la cadena, la
    # app sube igual y ffmpeg queda para el próximo arranque si falló.
    command:
      - sh
      - -c
      - (timeout 90 apk add --no-cache ffmpeg || echo "[arranque] ffmpeg no se pudo instalar; la app sube igual") ; npm run start
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/postgres
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /root/whatsaas:/app
    depends_on:
      - postgres
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=whatsaas_default
      - traefik.http.routers.whatspro.rule=Host(`whatspro.uno`) || Host(`www.whatspro.uno`) || Host(`chatpro.uno`)
      - traefik.http.routers.whatspro.entrypoints=websecure
      - traefik.http.routers.whatspro.tls=true
      - traefik.http.routers.whatspro.tls.certresolver=letsencrypt
      - traefik.http.services.whatspro.loadbalancer.server.port=3000
      # Typo domain: whatsapro.uno → whatspro.uno
      - traefik.http.routers.whatsapro-redirect.rule=Host(`whatsapro.uno`) || Host(`www.whatsapro.uno`)
      - traefik.http.routers.whatsapro-redirect.entrypoints=websecure
      - traefik.http.routers.whatsapro-redirect.tls=true
      - traefik.http.routers.whatsapro-redirect.tls.certresolver=letsencrypt
      - traefik.http.routers.whatsapro-redirect.priority=100
      - traefik.http.routers.whatsapro-redirect.middlewares=whatsapro-to-whatspro
      - traefik.http.routers.whatsapro-redirect.service=whatspro
      - traefik.http.middlewares.whatsapro-to-whatspro.redirectregex.regex=^https?://(?:www\.)?whatsapro\.uno(?:/(.*))?
      - traefik.http.middlewares.whatsapro-to-whatspro.redirectregex.replacement=https://whatspro.uno/$${1}
      - traefik.http.middlewares.whatsapro-to-whatspro.redirectregex.permanent=true

  # Puente del WebSocket de las terminales del admin hacia el Terminal Gateway
  # del host (PM2 `terminal-gateway`, 172.19.0.1:3400). Traefik sólo enruta a
  # contenedores; este nginx no hace nada más que pasar /terminal-gateway/*.
  # Ver docs/developer-command-center/00-ESTADO.md.
  terminal-proxy:
    image: nginx:alpine
    container_name: whatsaas-terminal-proxy
    volumes:
      - /root/whatsaas/config/terminal-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=whatsaas_default
      - traefik.http.routers.whatspro-terminal.rule=(Host(`whatspro.uno`) || Host(`www.whatspro.uno`) || Host(`chatpro.uno`)) && PathPrefix(`/terminal-gateway`)
      - traefik.http.routers.whatspro-terminal.entrypoints=websecure
      - traefik.http.routers.whatspro-terminal.tls=true
      - traefik.http.routers.whatspro-terminal.tls.certresolver=letsencrypt
      - traefik.http.routers.whatspro-terminal.priority=200
      - traefik.http.services.whatspro-terminal.loadbalancer.server.port=3400

volumes:
  postgres_data:
