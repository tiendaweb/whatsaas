# Proxy del WebSocket de las terminales (Developer Command Center).
#
# Traefik sólo enruta a contenedores (proveedor docker), y el Terminal Gateway
# corre en el HOST, escuchando únicamente en la IP del host dentro del bridge
# de docker (172.19.0.1:3400). Este nginx es el puente: recibe
# /terminal-gateway/* desde Traefik y lo pasa al host. No hace nada más: sin
# ticket firmado el gateway rechaza el upgrade igual.
server {
  listen 3400;
  server_name _;

  # La IP del host en el bridge `whatsaas_default`, a propósito y no
  # `host.docker.internal`: ese nombre resuelve al docker0 (172.17.0.1), y el
  # gateway escucha únicamente en 172.19.0.1.
  location /terminal-gateway/ {
    proxy_pass http://172.19.0.1:3400/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  location / {
    return 404;
  }
}
